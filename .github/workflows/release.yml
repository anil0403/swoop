name: release

# Builds the release files for a v* tag and publishes them on its GitHub release (see VERSIONING.md).
# Run by hand with no tag to only build them (kept as workflow artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (empty = build only)
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          # glibc, not musl: musl's memcpy halves engine speed. Built on 22.04 (glibc 2.35) so it runs on
          # Ubuntu 22.04+, Debian 12+, Fedora 36+ and rolling distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: uft-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: uft-linux-aarch64 }
          - { os: ubuntu-latest, target: aarch64-linux-android, name: uft-android-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: env.TAG != ''
        run: .github/set-version.sh "$TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: core
        run: |
          if [[ ${{ matrix.target }} == *android* ]]; then
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ../scripts/build-android.sh ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          # Laid out like a prefix (bin/...) so it unpacks straight into ~/.local or Termux's $PREFIX.
          mkdir -p ../pkg/bin ../dist
          cp target/${{ matrix.target }}/release/uft ../pkg/bin/
      - name: app
        if: ${{ !contains(matrix.target, 'android') }}
        working-directory: app
        run: |
          sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev
          # A git checkout, not the release archive: that one is x64 only.
          git clone -q --filter=blob:none -b "$(cat .flutter-version)" https://github.com/flutter/flutter "$RUNNER_TEMP/flutter"
          export PATH=$RUNNER_TEMP/flutter/bin:$PATH
          flutter build linux --release
          # The bundle stays together in lib/uft; the app finds its files through /proc/self/exe.
          mkdir -p ../pkg/lib ../pkg/share/applications
          cp -r build/linux/*/release/bundle ../pkg/lib/uft
          ln -s ../lib/uft/uft-app ../pkg/bin/uft-app
          cp linux/uft.desktop ../pkg/share/applications/
      - name: package
        run: cd pkg && tar -czf ../dist/${{ matrix.name }}.tar.gz *
      - name: appimage
        if: ${{ !contains(matrix.target, 'android') }}
        run: |
          arch=${{ startsWith(matrix.target, 'x86_64') && 'x86_64' || 'aarch64' }}
          mkdir -p AppDir/usr && cp -r pkg/* AppDir/usr/
          ln -s usr/bin/uft-app AppDir/AppRun
          sed 's/^Icon=.*/Icon=uft/' pkg/share/applications/uft.desktop > AppDir/uft.desktop
          cp app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png AppDir/uft.png
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          # No FUSE on the runners.
          ARCH=$arch APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" AppDir dist/uft-$arch.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  apk:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: env.TAG != ''
        run: ../.github/set-version.sh "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
      - name: build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          UFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # No key, no APK: one signed with a throwaway key could never be updated by the next release.
          if [[ -z $KEYSTORE ]]; then
            echo "::warning::no ANDROID_KEYSTORE secret; the release has no APK (see VERSIONING.md)"
            exit 0
          fi
          export UFT_KEYSTORE=$RUNNER_TEMP/release.jks
          base64 -d <<< "$KEYSTORE" > "$UFT_KEYSTORE"
          flutter build apk --release
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk ../dist/uft-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uft-android-apk
          path: dist/uft-android.apk
          if-no-files-found: ignore

  # ponytail: x86_64 only; an aarch64 bundle needs an arm runner in this container.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: uft-linux-x86_64
          path: packaging/flatpak
      - run: cp app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png packaging/flatpak/icon.png
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/dev.uft.uft.yml
          bundle: uft-x86_64.flatpak
          cache: false

  publish:
    needs: [build, apk, flatpak]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum * > SHA256SUMS
          pre=""
          [[ $TAG == *-* ]] && pre=--prerelease
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --generate-notes $pre
          gh release upload "$TAG" * --clobber
          # A beta stays a pre-release, so .../releases/latest/download/... always points at a release.
          gh release edit "$TAG" --draft=false ${pre:---latest}
      # Releases only (VERSIONING.md); the owner adds the AUR key.
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY == '' }}
        run: echo "::warning::no AUR_SSH_PRIVATE_KEY secret; uft-bin not updated on the AUR (see VERSIONING.md)"
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" src/packaging/aur/PKGBUILD
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: uft-bin
          pkgbuild: src/packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: ${{ github.repository_owner }}
          commit_email: ${{ github.repository_owner }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ env.TAG }}
