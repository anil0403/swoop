name: release

# Builds the release files for a v* tag and publishes them on its GitHub release (see VERSIONING.md).
# Run by hand with no tag to only build them (kept as workflow artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (empty = build only)
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          # glibc, not musl: musl's memcpy halves engine speed. Built on 22.04 (glibc 2.35) so it runs on
          # Ubuntu 22.04+, Debian 12+, Fedora 36+ and rolling distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: swoop-linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: swoop-linux-aarch64 }
          - { os: ubuntu-latest, target: aarch64-linux-android, name: swoop-android-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: env.TAG != ''
        run: .github/set-version.sh "$TAG"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Run on main (version.yml dispatches it there), so these caches are shared from run to run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/rust -> ../build/linux/${{ startsWith(matrix.target, 'x86_64') && 'x64' || 'arm64' }}/release/plugins/uft_bridge/cargokit_build
          key: ${{ matrix.target }}
      - if: ${{ !contains(matrix.target, 'android') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-${{ runner.arch }}-${{ hashFiles('app/.flutter-version') }}
      - name: build
        working-directory: core
        run: |
          if [[ ${{ matrix.target }} == *android* ]]; then
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ../scripts/build-android.sh ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
          # Laid out like a prefix (bin/...) so it unpacks straight into ~/.local or Termux's $PREFIX.
          mkdir -p ../pkg/bin ../pkg/share/licenses/swoop ../dist
          cp ../LICENSE ../pkg/share/licenses/swoop/
          cp target/${{ matrix.target }}/release/swoop ../pkg/bin/
      - name: app
        if: ${{ !contains(matrix.target, 'android') }}
        working-directory: app
        run: |
          sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev
          # A git checkout, not the release archive: that one is x64 only.
          [[ -d $RUNNER_TEMP/flutter ]] ||
            git clone -q --filter=blob:none -b "$(cat .flutter-version)" https://github.com/flutter/flutter "$RUNNER_TEMP/flutter"
          export PATH=$RUNNER_TEMP/flutter/bin:$PATH
          flutter build linux --release
          # The bundle stays together in lib/swoop; the app finds its files through /proc/self/exe.
          mkdir -p ../pkg/lib ../pkg/share/applications
          cp -r build/linux/*/release/bundle ../pkg/lib/swoop
          ln -s ../lib/swoop/swoop-app ../pkg/bin/swoop-app
          cp linux/io.github.anil0403.swoop.desktop ../pkg/share/applications/
          install -Dm644 linux/io.github.anil0403.swoop.svg -t ../pkg/share/icons/hicolor/scalable/apps
      - name: package
        run: cd pkg && tar -czf ../dist/${{ matrix.name }}.tar.gz *
      - name: appimage
        if: ${{ !contains(matrix.target, 'android') }}
        run: |
          arch=${{ startsWith(matrix.target, 'x86_64') && 'x86_64' || 'aarch64' }}
          mkdir -p AppDir/usr && cp -r pkg/* AppDir/usr/
          ln -s usr/bin/swoop-app AppDir/AppRun
          cp pkg/share/applications/io.github.anil0403.swoop.desktop pkg/share/icons/hicolor/scalable/apps/io.github.anil0403.swoop.svg AppDir/
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          # No FUSE on the runners.
          ARCH=$arch APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" AppDir dist/swoop-$arch.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  apk:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - if: env.TAG != ''
        run: ../.github/set-version.sh "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust -> ../build/uft_bridge/build
          key: apk-release
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - name: build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          UFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # No key yet (the owner's choice for now): signed with this runner's throwaway debug key, so each release's
          # APK only installs after uninstalling the previous one (README).
          if [[ -z $KEYSTORE ]]; then
            echo "::warning::no ANDROID_KEYSTORE secret; the APK is signed with a throwaway key (see VERSIONING.md)"
          else
            export UFT_KEYSTORE=$RUNNER_TEMP/release.jks
            base64 -d <<< "$KEYSTORE" > "$UFT_KEYSTORE"
          fi
          # Phones only: x86_64 is for emulators.
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk ../dist/swoop-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swoop-android-apk
          path: dist/swoop-android.apk
          if-no-files-found: ignore

  # ponytail: x86_64 only; an aarch64 bundle needs an arm runner in this container.
  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: swoop-linux-x86_64
          path: packaging/flatpak
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          manifest-path: packaging/flatpak/io.github.anil0403.swoop.yml
          bundle: swoop-x86_64.flatpak
          cache: false

  publish:
    needs: [build, apk, flatpak]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum * > SHA256SUMS
          pre=""
          [[ $TAG == *-* ]] && pre=--prerelease
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --generate-notes $pre
          gh release upload "$TAG" * --clobber
          # A beta stays a pre-release, so .../releases/latest/download/... always points at a release.
          gh release edit "$TAG" --draft=false ${pre:---latest}
      # Releases only (VERSIONING.md); the owner adds the AUR key.
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY == '' }}
        run: echo "::warning::no AUR_SSH_PRIVATE_KEY secret; swoop-bin not updated on the AUR (see VERSIONING.md)"
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        run: sed -i "s/^pkgver=.*/pkgver=${TAG#v}/" src/packaging/aur/PKGBUILD
      - if: ${{ !contains(env.TAG, '-') && env.AUR_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: swoop-bin
          pkgbuild: src/packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: ${{ github.repository_owner }}
          commit_email: ${{ github.repository_owner }}@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ env.TAG }}
