name: ci

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: core

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo fmt --check
      - run: ../.github/test-next-version.sh
      # ponytail: informational only; a hard >5% regression gate needs stable self-hosted hardware.
      - name: bench
        run: |
          cargo build --release --locked
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./target/release/swoop bench --size 2G | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    steps:
      # Keep the repository's LF line endings (the runner's git turns them into CRLF).
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --release --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo fmt --check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ../scripts/build-android.sh aarch64-linux-android

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust -> ../build/linux/x64/release/plugins/uft_bridge/cargokit_build
      - run: sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release

  windows-app:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust -> ../build/windows/x64/plugins/uft_bridge/cargokit_build
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter build windows --release

  apple-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The macOS app is universal (Apple silicon and Intel); iOS is arm64.
          targets: x86_64-apple-darwin, aarch64-apple-ios
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust -> ../build/uft_bridge/build
          key: apk
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter build apk --debug --target-platform android-arm64
