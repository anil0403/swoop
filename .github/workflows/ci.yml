name: ci

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash
    working-directory: core

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo fmt --check
      - run: ../.github/test-next-version.sh
      # ponytail: informational only; a hard >5% regression gate needs stable self-hosted hardware.
      - name: bench
        run: |
          cargo build --release --locked
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./target/release/uft bench --size 2G | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ../scripts/build-android.sh aarch64-linux-android

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: sudo apt-get update -q && sudo apt-get install -yq clang cmake ninja-build pkg-config libgtk-3-dev
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
          key: apk
      - run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
        id: flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter build apk --debug --target-platform android-arm64
