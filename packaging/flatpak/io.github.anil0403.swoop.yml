# Flatpak bundle of the Linux release build; release.yml puts swoop-linux-x86_64.tar.gz and icon.png next to this file.
# ponytail: no direct link in the sandbox (direct.rs runs nmcli, iw and dnsmasq); NetworkManager over D-Bus would
# bring it back. Same-network transfers, Bluetooth discovery and the save folder work.
id: io.github.anil0403.swoop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: swoop-app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
  - --system-talk-name=org.bluez
modules:
  - name: swoop
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib /app/bin
      - cp -r lib/swoop /app/lib/swoop
      - ln -s ../lib/swoop/swoop-app /app/bin/swoop-app
      - sed 's/^Icon=.*/Icon=io.github.anil0403.swoop/' share/applications/io.github.anil0403.swoop.desktop > io.github.anil0403.swoop.desktop
      - install -Dm644 io.github.anil0403.swoop.desktop -t /app/share/applications
      - install -Dm644 icon.png /app/share/icons/hicolor/192x192/apps/io.github.anil0403.swoop.png
    sources:
      - type: archive
        path: swoop-linux-x86_64.tar.gz
        strip-components: 0
      - type: file
        path: icon.png
